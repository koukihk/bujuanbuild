name: Mobile Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create Temporary Keystore
        run: |
          # 產生一個臨時的密鑰用於簽名（有效期1天）
          keytool -genkey -v -keystore release.keystore -alias temp_alias -keyalg RSA -keysize 2048 -validity 1 \
            -storepass password123 -keypass password123 -dname "CN=Temp, OU=Temp, O=Temp, L=Temp, S=Temp, C=US"
          
          # 將密鑰資訊寫入 android/key.properties
          echo "storePassword=password123" > android/key.properties
          echo "keyPassword=password123" >> android/key.properties
          echo "keyAlias=temp_alias" >> android/key.properties
          echo "storeFile=../release.keystore" >> android/key.properties

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: bujuan-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
