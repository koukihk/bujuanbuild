name: Mobile Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu' # 修正：這裡必須是 zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create Keystore in Expected Location
        run: |
          # 確保目錄存在
          mkdir -p android/app
          # 產生臨時金鑰
          keytool -genkey -v -keystore android/app/keystore.jks \
            -alias temp_alias -keyalg RSA -keysize 2048 -validity 1 \
            -storepass password123 -keypass password123 \
            -dname "CN=Temp, OU=Temp, O=Temp, L=Temp, S=Temp, C=US"
          
          # 寫入配置文件
          echo "storePassword=password123" > android/key.properties
          echo "keyPassword=password123" >> android/key.properties
          echo "keyAlias=temp_alias" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: bujuan-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
